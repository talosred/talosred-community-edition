{{define "layout-start"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalosRed CE</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script> 
  <link rel="preload" href="https://talosred.com/favicon.png" as="image">
  <link rel="icon" href="https://talosred.com/favicon.png">
  <meta name="color-scheme"  content="dark light">
  <meta name="author" content="TalosRed">
  <meta name="description" content="TalosRed is a high-performance proxy for AI APIs that provides logging, usage tracking, and cost analysis. Community Edition">
  <meta name="keywords" content="AI API, API Proxy, AI Cost Analysis, AI Rate Limiting, AI Usage Tracking, AI Dashboard, AI Telemetry, AI Observability">
  <meta name="generator" content="GoLang, TalosRed">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      Talos<b>Red</b>
      <span>Community Edition</span>
    </div>
    <a class="nav-item {{if eq .Page "logs"}}active{{end}}"
       href="/ui"
       hx-get="/ui"
       hx-target="body"
       hx-push-url="true">
      Logs
    </a>
    <a class="nav-item {{if eq .Page "usage"}}active{{end}}"
       href="/ui/usage"
       hx-get="/ui/usage"
       hx-target="body"
       hx-push-url="true">
      Usage
    </a>
    <a class="nav-item {{if eq .Page "aliases"}}active{{end}}"
       href="/ui/aliases"
       hx-get="/ui/aliases"
       hx-target="body"
       hx-push-url="true">
      Aliases
    </a>
    <a class="nav-item {{if eq .Page "hooks"}}active{{end}}"
       href="/ui/hooks"
       hx-get="/ui/hooks"
       hx-target="body"
       hx-push-url="true">
      Hooks
    </a>
    <a class="nav-item {{if eq .Page "pricing"}}active{{end}}"
       href="/ui/pricing"
       hx-get="/ui/pricing"
       hx-target="body"
       hx-push-url="true">
      Pricing
    </a>
    <a class="nav-item {{if eq .Page "settings"}}active{{end}}"
       href="/ui/settings"
       hx-get="/ui/settings"
       hx-target="body"
       hx-push-url="true">
      Settings
    </a>
    <div class="sidebar-footer">
      <span>Want more features ?</span>
      <a class="upsell-btn" href="https://talosred.com" target="_blank" rel="noopener">
        Visit TalosRed.com ↗
      </a>
    </div>
  </aside>
  <div class="main">
{{end}}

{{define "layout-end"}}
  </div>
</body>
</html>
{{end}}
