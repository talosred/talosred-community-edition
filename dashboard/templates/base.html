<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalosRed CE</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      TalosRed
      <span>Community Edition</span>
    </div>
    <a class="nav-item {{if eq .Page "logs"}}active{{end}}"
       href="/ui"
       hx-get="/ui"
       hx-target="body"
       hx-push-url="true">
      Logs
    </a>
    <a class="nav-item {{if eq .Page "settings"}}active{{end}}"
       href="/ui/settings"
       hx-get="/ui/settings"
       hx-target="body"
       hx-push-url="true">
      Settings
    </a>
    <div class="sidebar-footer">
      <a class="upsell-btn" href="https://talosred.io" target="_blank" rel="noopener">
        Enterprise Blocking &amp; Caching ↗
      </a>
    </div>
  </aside>
  <div class="main">
    {{template "content" .}}
  </div>
</body>
</html>
